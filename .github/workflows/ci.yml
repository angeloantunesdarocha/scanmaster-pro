name: Validar ScanMaster Pro

on:
  pull_request:
  push:
    branches: [main, refactor/pdf-offline-v2]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install

      - name: Executar testes
        run: npm test

      - name: Gerar build
        run: npm run build
